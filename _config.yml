about_content: | # this will include new lines to allow paragraphs
  Hi! I am a computer architecture and systems researcher — a Ph.D. candidate at Seoul National University (SNU, Ph.D. expected Feb. 2027), advised by Professor Jung Ho Ahn, and currently a visiting scholar at the University of Illinois Urbana-Champaign (UIUC) working with Professor Nam Sung Kim. Before joining SNU, I completed my B.S. in Electrical and Electronics Engineering at Chung-Ang University (CAU).

  My research focuses on memory systems for AI workloads. I have extensive hands-on experience in real-hardware DRAM characterization (FPGA-based test platforms for DDR4/DDR5/HBM), memory controller design and simulation, and memory-system architecture for LLM inference, recommendation, and GNN workloads. I led the design of <b>RoMe</b> (HPCA'26), a row-granularity memory system for LLM serving, and <b>DRAMScope</b> (ISCA'24), which reverse-engineers DRAM microarchitecture from commodity chips; I co-designed <b>ARC</b> (MICRO'26), an adaptive hotness monitoring unit for CXL tiered memory.

  I have 15 publications at ISCA, HPCA, ASPLOS, MICRO, and IEEE S&P, and 10 patent applications (US, CN, PCT, KR). My research goal: make memory the accelerator, not the bottleneck, for large-scale AI.

  For more details, please refer to my [CV](https://drive.google.com/file/d/1foQiRAWBbPesP2C-eGsCPT__lKlL6cQb/view?usp=drive_link).

